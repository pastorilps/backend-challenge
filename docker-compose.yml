services:
  # --- BANCO DE DADOS POSTGRESQL (BANCO ÚNICO) ---
  postgres:
    image: postgres:16-alpine
    container_name: local_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: my_database
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d my_database']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # --- CACHE / NO SQL REDIS ---
  redis:
    image: redis:7-alpine
    container_name: local_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app_network

  # --- EMULADOR AWS MINISTACK (APENAS SQS) ---
  ministack:
    image: ministackorg/ministack:latest
    container_name: local_aws
    restart: always
    ports:
      - '4566:4566'
    environment:
      LOG_LEVEL: ${MINISTACK_LOG_LEVEL:-INFO}
      MINISTACK_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app_network

  sqs-init:
    image: amazon/aws-cli:2
    container_name: local_sqs_init
    entrypoint: ['/bin/sh', '/scripts/init-sqs.sh']
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      SQS_ENDPOINT_URL: http://ministack:4566
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
      SQS_MAX_ATTEMPTS: ${SQS_MAX_ATTEMPTS:-5}
    volumes:
      - ./docker/ministack/init-sqs.sh:/scripts/init-sqs.sh:ro
    depends_on:
      ministack:
        condition: service_healthy
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    name: app_network

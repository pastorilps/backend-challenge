services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_DB: ${POSTGRES_DB:-monkeyg}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network

  ministack:
    image: ministackorg/ministack:latest
    restart: unless-stopped
    ports:
      - '${MINISTACK_PORT:-4566}:4566'
      - '${APP_PORT:-3000}:3000'
    environment:
      LOG_LEVEL: ${MINISTACK_LOG_LEVEL:-INFO}
      MINISTACK_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
      MINISTACK_REGION: ${AWS_REGION:-us-east-1}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-rootpassword}@postgres:5432/${POSTGRES_DB:-monkeyg}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCOUNT_ID: ${AWS_ACCOUNT_ID:-000000000000}
      SQS_ENDPOINT_URL: http://ministack:4566
      SQS_QUEUE_URL: http://ministack:4566/${AWS_ACCOUNT_ID:-000000000000}/${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_URL: http://ministack:4566/${AWS_ACCOUNT_ID:-000000000000}/${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_URL: http://ministack:4566/${AWS_ACCOUNT_ID:-000000000000}/${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
      SQS_HEALTHCHECK_URL: http://ministack:4566/_ministack/health
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-wager-transactions.fifo}
      SQS_DLQ_NAME: ${SQS_DLQ_NAME:-wager-transactions-dlq.fifo}
      SQS_EVENTS_QUEUE_NAME: ${SQS_EVENTS_QUEUE_NAME:-wager-events.fifo}
      SQS_CONSUMER_NAME: ${SQS_CONSUMER_NAME:-wager-transaction-consumer}
      SQS_MAX_ATTEMPTS: ${SQS_MAX_ATTEMPTS:-5}
      SQS_RETRY_BASE_DELAY_MS: ${SQS_RETRY_BASE_DELAY_MS:-1000}
      SQS_RETRY_MAX_DELAY_MS: ${SQS_RETRY_MAX_DELAY_MS:-300000}
      SQS_VISIBILITY_TIMEOUT_SECONDS: ${SQS_VISIBILITY_TIMEOUT_SECONDS:-60}
      SQS_WAIT_TIME_SECONDS: ${SQS_WAIT_TIME_SECONDS:-20}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID:-}
      COGNITO_ENDPOINT_URL: ${COGNITO_ENDPOINT_URL:-http://localhost:4566}
      COGNITO_PROVIDER_CLIENTS: ${COGNITO_PROVIDER_CLIENTS:-}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-10}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
    network_mode: service:ministack
    depends_on:
      postgres:
        condition: service_healthy
      ministack:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:

networks:
  app_network:
